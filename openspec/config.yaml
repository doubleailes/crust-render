schema: spec-driven

# Project context — shown to AI when creating OpenSpec artifacts.
context: |
  Crust Render is a production-inspired, CPU-only toy path tracer in pure, safe
  Rust (edition 2024). The guiding goal is to bring industry-standard graphics
  formats and models — OpenUSD (scene interchange) and OpenPBR (surface shading)
  — into a Rust environment, drawing on PBRT, "Ray Tracing in One Weekend", and
  Autodesk Standard Surface.

  Guiding principles (apply when writing proposals and specs):
  - Performance is a core concern: prefer designs and data layouts that keep the
    CPU path tracer fast (Rayon parallelism, cache-friendly structures, BVH).
    Flag proposals that would regress render throughput.
  - CPU only — there is no GPU backend; do not spec one.
  - The CLI is the only UI for now; assume no interactive/GUI surface.
  - "Production-inspired toy": favor correct, industry-aligned semantics
    (OpenUSD scene model, OpenPBR shading) over breadth of one-off features.

  Tech stack:
  - Rust 2024, Cargo workspace with six crates under crates/:
    - crust-rt: the intersection kernel (Embree-shaped API, SBVH → BVH4), no crust deps.
    - crust-mtlx: the MaterialX .mtlx reader (parse → compiled program → flattened
      BSDF lobes), no crust deps; crust-core re-exports its `Texture` trait as `Texture2D`.
    - crust-core: the whole engine as a library (renderer, integrator, materials incl.
      the MaterialX→OpenPBR adapter, lights, volumes, path guiding, USD import).
    - crust-assets: host-side decoders implementing crust_core::AssetLoader
      (EXR/LDR environment maps, Ptex, UV/UDIM textures) over exr, image, ptex-rs.
    - crust-render: the thin CLI binary (main.rs only; writes EXR + PNG, decodes
      nothing) — clap args, builds a Scene with crust_assets::FileAssets, runs the Renderer.
    - utils: math/RNG helpers (random*, balance_heuristic, align_to_normal, clamp, Lerp).
  - Key deps: glam (Vec3A/Mat4), rayon (parallelism), exr + image (output and decoding),
    openusd 0.6 (scene import — always compiled in, no feature flag), openqmc-rs (QMC
    sampling), opensubdiv-rs (subdivision), ptex-rs (Ptex), roxmltree (MaterialX XML),
    tracing (logging), indicatif (progress bar), criterion (benches).

  Domain conventions:
  - Scenes load exclusively from USD (.usda/.usdc/.usdz). RON, Alembic (.abc),
    and OBJ (Wavefront) are deprecated/out of scope — do not add or spec loaders
    for any non-USD scene or mesh format.
  - Requirements should describe observable renderer behavior (CLI, image output,
    scene interpretation), not internal Rust types, unless the type is the contract.
  - Describe the CURRENT implemented behavior in openspec/specs/. Note known gaps
    explicitly rather than speccing unimplemented features as done.

  Known incomplete work (do not spec as working):
  - Adaptive sampling params (min_samples_per_pixel, variance_threshold, frame) are
    parsed into RenderSettings but NOT consumed by the tracer yet.
  - Non-sphere USD lux lights (Rect/Disk/Distant/Dome/Cylinder) warn once and are skipped.

# Per-artifact rules (optional).
rules:
  specs:
    - Describe observable behavior (CLI flags, files produced, image results), not Rust internals.
    - Every requirement must have at least one WHEN/THEN scenario.
    - Mark not-yet-implemented behavior clearly; never spec it as if it works.

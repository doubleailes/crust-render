# The environment hdCrust is built and run in: OpenUSD 26 with usdview, its
# headers and CMake package (`pxrConfig.cmake`), from Anders Langlands'
# ASWF channel (https://github.com/anderslanglands/aswf-pixi). The plugin
# must be built against the OpenUSD the host runs, so usdview comes from
# here too. MSVC on Windows comes from the system (vcvars64).
[workspace]
name = "hdcrust"
channels = ["https://conda.anaconda.org/anderslanglands", "conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
openusd = "26.08.*"
python = "3.12.*"
cmake = ">=3.26"
ninja = "*"

# Linux: conda-forge's C++ toolchain, so the plugin uses the libstdc++ the
# OpenUSD package was built with. Windows uses the system MSVC (vcvars64).
[target.linux-64.dependencies]
cxx-compiler = "*"

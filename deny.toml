# cargo-deny policy, checked in CI (`deny` job in .github/workflows/rust.yml)
# against the committed Cargo.lock. Run locally with `cargo deny --locked check`.

[graph]
# The nightly-only `bvh8` feature adds no dependency; the default features
# are what ships.
all-features = false

[advisories]
# Report soundness advisories for every crate in the graph, not only direct
# dependencies: "safe Rust" is a property of the whole binary.
unsound = "all"
unmaintained = "all"
ignore = [
    # `paste` is unmaintained, not vulnerable; it is a build-time proc macro
    # reached through `exr` -> `pulp`, and nothing here can replace it.
    { id = "RUSTSEC-2024-0436", reason = "build-time proc macro via exr -> pulp; unmaintained, no known vulnerability" },
    # `zip` 2.x reached only through `ocio`, whose every release requires
    # `zip ^2`. All three advisories are in `ZipArchive::extract` and
    # `ZipStreamReader::extract` (symlinks and permission bits written to
    # disk); ocio never extracts, it reads OCIOZ entries through
    # `ZipArchive::new` / `by_index` into memory and writes archives with
    # `ZipWriter`. Remove when ocio moves to zip 9 (2026-10-17).
    { id = "RUSTSEC-2026-0367", reason = "zip 2.4.2 via ocio; only ZipArchive::extract is affected and ocio never extracts" },
    { id = "RUSTSEC-2026-0368", reason = "zip 2.4.2 via ocio; only ZipArchive::extract is affected and ocio never extracts" },
    { id = "RUSTSEC-2026-0369", reason = "zip 2.4.2 via ocio; only the extract functions are affected and ocio never extracts" },
]

[licenses]
# Every licence currently in the graph, all permissive. A new one fails the
# check and has to be added here deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# Boost (BSL-1.0) is permissive, but allowed only where it is needed: the
# hash `ocio` builds its processor cache keys with.
exceptions = [
    { allow = ["BSL-1.0"], crate = "xxhash-rust" },
]

[bans]
# Duplicates are all upstream-driven today (bitflags, hashbrown,
# miniz_oxide, syn, windows-sys); watch them, don't fail on them.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace carry no version requirement.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The git dependencies, each resolved to a commit in Cargo.lock: OpenSubdiv-rs,
# pinned by release tag, openusd / openusd-schemas, patched to `main`, and
# exr, patched to a branch with deep data (see `[patch.crates-io]` in the
# workspace Cargo.toml).
allow-git = [
    "https://github.com/doubleailes/OpenSubdiv-rs",
    "https://github.com/mxpv/openusd",
    # exr with deep data (the `deep` feature), patched in for OpenEXRId
    # mattes until it is released upstream.
    "https://github.com/doubleailes/exrs",
]

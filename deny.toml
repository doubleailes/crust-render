# cargo-deny policy, checked in CI (`deny` job in .github/workflows/rust.yml)
# against the committed Cargo.lock. Run locally with `cargo deny --locked check`.

[graph]
# The nightly-only `bvh8` feature adds no dependency; the default features
# are what ships.
all-features = false

[advisories]
# Report soundness advisories for every crate in the graph, not only direct
# dependencies: "safe Rust" is a property of the whole binary.
unsound = "all"
unmaintained = "all"
ignore = [
    # `lru` 0.12.5, reached only through `ptex-rust` (git, our own fork). The
    # fix is a bump to lru >= 0.18.2 in that repository, then a new `rev` in
    # the workspace Cargo.toml. Remove both entries with that bump.
    { id = "RUSTSEC-2026-0002", reason = "lru via ptex-rust; fixed by bumping lru in doubleailes/ptex-rs" },
    { id = "RUSTSEC-2026-0253", reason = "lru via ptex-rust; fixed by bumping lru in doubleailes/ptex-rs" },
    # `paste` is unmaintained, not vulnerable; it is a build-time proc macro
    # reached through `exr` -> `pulp`, and nothing here can replace it.
    { id = "RUSTSEC-2024-0436", reason = "build-time proc macro via exr -> pulp; unmaintained, no known vulnerability" },
]

[licenses]
# Every licence currently in the graph, all permissive. A new one fails the
# check and has to be added here deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicates are all upstream-driven today (bitflags, hashbrown,
# miniz_oxide, syn, windows-sys); watch them, don't fail on them.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace carry no version requirement.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The two git dependencies: ptex-rs pinned by `rev`, OpenSubdiv-rs by release
# tag, both resolved to a commit in Cargo.lock.
allow-git = [
    "https://github.com/doubleailes/ptex-rs",
    "https://github.com/doubleailes/OpenSubdiv-rs",
]

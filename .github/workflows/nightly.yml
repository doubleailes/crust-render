name: Nightly

# The same CI as rust.yml, on nightly Rust, as a separate workflow so it runs
# in parallel with the stable pipeline and reports as its own set of checks.
# It exists for two reasons: the nightly-only `bvh8` feature (8-wide BVH
# nodes on `std::simd`, docs/simd.md "BVH8 on nightly") can only be built
# here, and a nightly break in the rest of the workspace is worth seeing
# weeks before it reaches a stable release.
#
# Two channels, and they mean different things when they go red:
#   - pinned: one dated nightly. Deterministic, so a failure is this
#     repository's code, and the job fails like any other check. Bump the
#     date deliberately, the way rust.yml bumps RUST_VERSION.
#   - latest: whatever nightly is current. A failure may be the compiler's
#     or a new lint on code nobody touched, so these jobs are
#     `continue-on-error` and never turn the run red. The daily schedule
#     keeps them running when nothing is pushed, which is when drift shows.
#
# Whether any of these checks blocks a merge is decided by branch
# protection, not here. rust.yml's release job does not depend on them.
#
# The scheduled run (and a manual dispatch on the default branch) also
# publishes a nightly binary built with the latest nightly, as the rolling
# `nightly` pre-release: see the `nightly-build` and `nightly-publish` jobs
# at the end. It is published only when every check above, the `latest`
# legs included, passed in the same run on the compiler that built it;
# otherwise the previous nightly stays up.

# A change that touches only documentation (the OpenSpec records, docs/, the
# site/ user documentation, images, Markdown anywhere) cannot change what
# these jobs build or test, so it does not start them: no crate reads any of
# those paths (tests load samples/ and their own data/ fixtures only). A push
# or pull request that touches anything else alongside runs everything as
# usual. site/ has its own workflow, docs.yml. Keep the push and
# pull_request lists identical. The daily schedule has no filter and always
# runs.

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "openspec/**"
      - "docs/**"
      - "site/**"
      - "images/**"
      - "logo/**"
      - ".claude/**"
      - "**/*.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths-ignore:
      - "openspec/**"
      - "docs/**"
      - "site/**"
      - "images/**"
      - "logo/**"
      - ".claude/**"
      - "**/*.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

# A newer push to the same ref supersedes the older run. Runs that publish
# the nightly release queue in a group of their own instead, so a push to
# the default branch can never cancel one halfway through replacing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'release' || 'ci' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  NIGHTLY_PINNED: nightly-2026-09-26
  # Whether this run publishes the nightly release, for step conditions
  # (`env` is not available to a job's `if:`, which repeats the expression).
  PUBLISH_NIGHTLY: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) }}

jobs:
  # Workspace clippy, every target, as rust.yml runs it on stable. rustfmt is
  # not repeated: formatting is a text check that stable already gates.
  clippy:
    name: clippy (${{ matrix.channel }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.channel == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        channel: [pinned, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          tc=${{ matrix.channel == 'pinned' && env.NIGHTLY_PINNED || 'nightly' }}
          rustup toolchain install "$tc" --profile minimal --component clippy
          # Not `rustup default`: rust-toolchain.toml outranks it, and
          # every cargo call here would quietly build on the stable pin.
          # RUSTUP_TOOLCHAIN outranks the file.
          echo "RUSTUP_TOOLCHAIN=$tc" >> "$GITHUB_ENV"
          RUSTUP_TOOLCHAIN="$tc" rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.channel }}
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      # See test for what the receipt is for.
      - name: Leave a receipt for the nightly release
        if: matrix.channel == 'latest' && env.PUBLISH_NIGHTLY == 'true'
        run: rustc --version > receipt-clippy.txt
      - if: matrix.channel == 'latest' && env.PUBLISH_NIGHTLY == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-receipt-clippy
          path: receipt-clippy.txt
          retention-days: 1

  test:
    name: test (${{ matrix.channel }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.channel == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        channel: [pinned, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          tc=${{ matrix.channel == 'pinned' && env.NIGHTLY_PINNED || 'nightly' }}
          rustup toolchain install "$tc" --profile minimal
          # Not `rustup default`: rust-toolchain.toml outranks it, and
          # every cargo call here would quietly build on the stable pin.
          # RUSTUP_TOOLCHAIN outranks the file.
          echo "RUSTUP_TOOLCHAIN=$tc" >> "$GITHUB_ENV"
          RUSTUP_TOOLCHAIN="$tc" rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.channel }}
      - name: Run tests
        run: cargo test --workspace --no-fail-fast
      # The nightly release must not ship a compiler any `latest` leg failed
      # on, but those legs are `continue-on-error`, so whether a job that
      # `needs` them still runs is not something to lean on. Each passing
      # one leaves a receipt naming its compiler instead, and nightly-publish
      # refuses to publish without all three (clippy, test, bvh8).
      - name: Leave a receipt for the nightly release
        if: matrix.channel == 'latest' && env.PUBLISH_NIGHTLY == 'true'
        run: rustc --version > receipt-test.txt
      - if: matrix.channel == 'latest' && env.PUBLISH_NIGHTLY == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-receipt-test
          path: receipt-test.txt
          retention-days: 1

  # What only nightly can build. The kernel is linted and tested with 8-wide
  # nodes (its tests pin both node layouts, and hit results against a linear
  # scan), and the renderer is checked with the feature forwarded through
  # crust-core, so the plumbing cannot rot either.
  bvh8:
    name: bvh8 (${{ matrix.channel }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.channel == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        channel: [pinned, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          tc=${{ matrix.channel == 'pinned' && env.NIGHTLY_PINNED || 'nightly' }}
          rustup toolchain install "$tc" --profile minimal --component clippy
          # Not `rustup default`: rust-toolchain.toml outranks it, and
          # every cargo call here would quietly build on the stable pin.
          # RUSTUP_TOOLCHAIN outranks the file.
          echo "RUSTUP_TOOLCHAIN=$tc" >> "$GITHUB_ENV"
          RUSTUP_TOOLCHAIN="$tc" rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: bvh8-${{ matrix.channel }}
      - name: Lint crust-rt
        run: cargo clippy -p crust-rt --all-targets --features bvh8 -- -D warnings
      - name: Test crust-rt
        run: cargo test -p crust-rt --features bvh8 --no-fail-fast
      - name: Check the renderer with bvh8 forwarded
        run: cargo check -p crust-render --features bvh8
      # See test for what the receipt is for.
      - name: Leave a receipt for the nightly release
        if: matrix.channel == 'latest' && env.PUBLISH_NIGHTLY == 'true'
        run: rustc --version > receipt-bvh8.txt
      - if: matrix.channel == 'latest' && env.PUBLISH_NIGHTLY == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-receipt-bvh8
          path: receipt-bvh8.txt
          retention-days: 1

  # The nightly binary: the `crust` CLI, release profile, built with the
  # latest nightly for each target. Only the scheduled run and a manual
  # dispatch on the default branch build it; pushes and pull requests never
  # do. Like every `latest` job it is `continue-on-error`: a nightly
  # compiler that cannot build or run the renderer is reported on the job,
  # and the previous nightly release stays up.
  #
  # The targets follow rust.yml's releases, except Windows, which builds
  # natively for MSVC (with a static CRT, so no redistributable is needed)
  # rather than cross-compiling for GNU, and macOS, which adds Apple
  # silicon. The Linux build is musl, so it runs on any distribution.
  nightly-build:
    name: nightly binary (${{ matrix.target }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    needs: [clippy, test, bvh8]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            rustflags: -C target-feature=+crt-static
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled on the Apple silicon runner, so it is not run.
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: true
    defaults:
      run:
        shell: bash
    env:
      # `--target` is always passed, so these reach the shipped binary but
      # not the host's build scripts and proc macros.
      RUSTFLAGS: -D warnings ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          rustup toolchain install nightly --profile minimal --target ${{ matrix.target }}
          # RUSTUP_TOOLCHAIN outranks rust-toolchain.toml (see above).
          echo "RUSTUP_TOOLCHAIN=nightly" >> "$GITHUB_ENV"
          RUSTUP_TOOLCHAIN=nightly rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p crust-render --target ${{ matrix.target }}
      # A binary that builds but cannot load a USD stage and write an image
      # (the JIT included) is not worth shipping.
      - name: Smoke render
        if: ${{ !matrix.cross }}
        run: |
          target/${{ matrix.target }}/release/crust render \
            -i samples/cornellbox.usda -o "$RUNNER_TEMP/smoke.exr" -s 1
          test -s "$RUNNER_TEMP/smoke.exr"
      - name: Package
        run: |
          name=crust-nightly-${{ matrix.target }}
          mkdir -p "dist/$name"
          case "${{ matrix.target }}" in
            *windows*) bin=crust.exe ;;
            *) bin=crust ;;
          esac
          cp "target/${{ matrix.target }}/release/$bin" README.md LICENSE "dist/$name/"
          {
            echo "commit: $GITHUB_SHA"
            echo "target: ${{ matrix.target }}"
            rustc -vV
          } > "dist/$name/BUILD-INFO.txt"
          cd dist
          case "${{ matrix.target }}" in
            *windows*) 7z a -tzip "$name.zip" "$name" > /dev/null; archive=$name.zip ;;
            *) tar -czf "$name.tar.gz" "$name"; archive=$name.tar.gz ;;
          esac
          rm -r "$name"
          # One checksum file per archive; nightly-publish merges them.
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      # Which compiler built it, so nightly-publish can check it is the one
      # the `latest` legs passed on (a new nightly may land in between).
      - name: Record the toolchain
        run: rustc --version > "dist/toolchain-${{ matrix.target }}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  # Replaces the rolling `nightly` pre-release with this run's binaries,
  # all of them or none. The gate runs before anything is touched: a missing
  # archive, a bad checksum, or a missing or mismatched receipt from a
  # `latest` leg leaves the previous release as it is. The replacement is
  # then staged as a draft, and only once every asset is verified uploaded
  # is the old release removed and the draft published under the `nightly`
  # tag at the commit that was built (so the tag moves with it). That
  # switch is three API calls with no upload in between; if publishing the
  # draft still fails, the complete draft is left for a re-run.
  # Releases made with GITHUB_TOKEN trigger no workflow, so rust.yml's
  # `release: created` job does not run for it (and skips the tag anyway).
  nightly-publish:
    name: publish nightly release
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)) }}
    needs: [nightly-build]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    env:
      TARGETS: x86_64-unknown-linux-musl x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nightly-*
          path: dist
          merge-multiple: true
      - name: Check every target against the receipts
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          for job in clippy test bvh8; do
            test -s "receipt-$job.txt" || {
              echo "::error::$job (latest) did not pass in this run; not publishing"; exit 1; }
            cmp -s receipt-test.txt "receipt-$job.txt" || {
              echo "::error::$job (latest) ran on $(cat "receipt-$job.txt"), test (latest) on $(cat receipt-test.txt); not publishing"
              exit 1; }
          done
          : > "$RUNNER_TEMP/assets.txt"
          for t in $TARGETS; do
            case "$t" in
              *windows*) a=crust-nightly-$t.zip ;;
              *) a=crust-nightly-$t.tar.gz ;;
            esac
            test -s "$a" || {
              echo "::error::no nightly archive $a; not publishing"; exit 1; }
            sha256sum -c "$a.sha256" || {
              echo "::error::$a does not match its checksum; not publishing"; exit 1; }
            cmp -s receipt-test.txt "toolchain-$t.txt" || {
              echo "::error::$t was built with $(cat "toolchain-$t.txt"), checked with $(cat receipt-test.txt); not publishing"
              exit 1; }
            cat "$a.sha256" >> SHA256SUMS
            echo "$a" >> "$RUNNER_TEMP/assets.txt"
          done
          echo SHA256SUMS >> "$RUNNER_TEMP/assets.txt"
      - name: Publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t assets < "$RUNNER_TEMP/assets.txt"
          releases() { gh api "repos/$GH_REPO/releases?per_page=100" --jq "$1"; }
          tag_count() {
            gh api "repos/$GH_REPO/git/matching-refs/tags/nightly" \
              --jq '[.[] | select(.ref == "refs/tags/nightly")] | length'
          }
          date=$(date -u +%Y-%m-%d)
          {
            echo "Built from ${GITHUB_SHA} on ${date} with \`$(cat receipt-test.txt)\`,"
            echo "the latest nightly Rust, after the workspace's lints and tests passed on that"
            echo "same toolchain."
            echo
            echo "A nightly build is untested beyond CI. For a stable binary, take the"
            echo "latest numbered release."
          } > notes.md

          # Drafts a failed run left behind are invisible to users; drop them.
          stale=$(releases '.[] | select(.draft and (.tag_name | startswith("nightly-staging-"))) | .id')
          for id in $stale; do gh api -X DELETE "repos/$GH_REPO/releases/$id"; done

          # 1. Stage. A draft creates no tag, so the current release is untouched.
          stage="nightly-staging-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$stage" --draft --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Nightly ${date}" --notes-file notes.md \
            "${assets[@]}"
          id=$(releases ".[] | select(.draft and .tag_name == \"$stage\") | .id")
          test -n "$id"

          # 2. Verify every asset arrived whole.
          expected=$(for a in "${assets[@]}"; do echo "$a $(stat -c %s "$a")"; done | sort)
          actual=$(gh api "repos/$GH_REPO/releases/$id" \
            --jq '.assets[] | select(.state == "uploaded") | "\(.name) \(.size)"' | sort)
          [ "$expected" = "$actual" ] || {
            echo "::error::staged assets differ from the build:"; diff <(echo "$expected") <(echo "$actual") || true
            exit 1; }

          # 3. Switch. Remove the old release and its tag (every error stops
          # here: a tag left in place would pin the new release to the old
          # commit), then publish the draft as `nightly` at this commit.
          old=$(releases '.[] | select((.draft | not) and .tag_name == "nightly") | .id')
          for id_old in $old; do gh api -X DELETE "repos/$GH_REPO/releases/$id_old"; done
          n=$(tag_count)
          if [ "$n" != 0 ]; then gh api -X DELETE "repos/$GH_REPO/git/refs/tags/nightly"; fi
          n=$(tag_count)
          [ "$n" = 0 ] || { echo "::error::the nightly tag is still there; not publishing"; exit 1; }
          for attempt in 1 2 3; do
            if gh api -X PATCH "repos/$GH_REPO/releases/$id" -f tag_name=nightly \
                -f target_commitish="$GITHUB_SHA" -F draft=false -f make_latest=false > /dev/null; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::could not publish draft release $id; it is complete and can be published by hand"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          sha=$(gh api "repos/$GH_REPO/git/ref/tags/nightly" --jq .object.sha)
          [ "$sha" = "$GITHUB_SHA" ] || {
            echo "::error::the nightly tag points at $sha, not $GITHUB_SHA"; exit 1; }

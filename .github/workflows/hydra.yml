name: Hydra

# hdCrust, the Hydra render delegate (openspec/specs/hydra-delegate): built
# against OpenUSD 26 from hydra/pixi.toml (the `openusd` package of Anders
# Langlands' ASWF channel, cached on pixi.lock), and tested headless against
# `crust render`. Not a required check: `cargo build` and the Rust workflow
# never need OpenUSD's C++. Runs on changes that can reach the delegate,
# nightly, and by hand.

on:
  push:
    branches:
      - main
      - master
    paths:
      - "crates/crust-hydra/**"
      - "hydra/**"
      - "crates/crust-render/src/lib.rs"
      - "crates/crust-render/src/session/**"
      - "crates/crust-core/src/live.rs"
      - "crates/crust-core/src/scene/usd_import/live.rs"
      - ".github/workflows/hydra.yml"
  pull_request:
    paths:
      - "crates/crust-hydra/**"
      - "hydra/**"
      - "crates/crust-render/src/lib.rs"
      - "crates/crust-render/src/session/**"
      - "crates/crust-core/src/live.rs"
      - "crates/crust-core/src/scene/usd_import/live.rs"
      - ".github/workflows/hydra.yml"
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The Rust workflow's pin (rust-toolchain.toml).
  RUST_VERSION: "1.99"

jobs:
  # The plugin built and installed, then the three headless checks:
  # compare.sh (the delegate's image against `crust render` of the layers it
  # wrote, bitwise), interaction.sh (camera, edits, time, playback, settings,
  # AOVs) and usdc_roundtrip.sh (every sample through Pixar-written USDC).
  hdcrust:
    name: hdCrust (OpenUSD 26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The workspace's release build, and the `hydra` profile build the
          # CMake project runs into its own target directory.
          cache-directories: hydra/build/cargo
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          manifest-path: hydra/pixi.toml
          cache: true
          locked: true
      - name: The pxr CMake package resolves
        working-directory: hydra
        run: pixi run cmake --version && find .pixi/envs/default -maxdepth 2 -name pxrConfig.cmake | grep .
      - name: crust (the CLI the checks compare with)
        run: cargo build --release -p crust-render
      - name: Build and install hdCrust
        working-directory: hydra
        run: |
          pixi run cmake -S hdCrust -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          pixi run cmake --build build
          pixi run cmake --install build --prefix install
      - name: DEBUG materialx_basic
        working-directory: hydra
        continue-on-error: true
        run: |
          set -x
          sudo apt-get install -y gdb >/dev/null 2>&1 || true
          export PXR_PLUGINPATH_NAME="$PWD/install/plugin/usd/hdCrust/resources"
          pixi run usdcat ../samples/materialx_basic.mtlx | head -20; echo "usdcat mtlx exit ${PIPESTATUS[0]}"
          pixi run usdcat --flatten ../samples/materialx_basic.usda | head -20; echo "usdcat usda exit ${PIPESTATUS[0]}"
          mkdir -p "$RUNNER_TEMP/dbg"
          pixi run install/bin/hdCrustTest ../samples/materialx_basic.usda "$RUNNER_TEMP/dbg/hd.exr" "$RUNNER_TEMP/dbg" --camera /World/ShotCam --width 160 --height 90 --spp 16; echo "hdCrustTest exit $?"
          pixi run gdb -batch -ex run -ex bt --args install/bin/hdCrustTest ../samples/materialx_basic.usda "$RUNNER_TEMP/dbg/hd.exr" "$RUNNER_TEMP/dbg" --camera /World/ShotCam --width 160 --height 90 --spp 16 2>&1 | tail -60
      - name: Delegate against crust render
        working-directory: hydra
        run: pixi run bash hdCrust/test/compare.sh "$PWD/install" "$RUNNER_TEMP/compare"
      - name: Interaction
        working-directory: hydra
        run: pixi run bash hdCrust/test/interaction.sh "$PWD/install" "$RUNNER_TEMP/interact"
      - name: USDC round trip
        working-directory: hydra
        # cornellbox_guided renders one of two images from run to run (path
        # guiding, a crust-core issue tracked apart): its line may say
        # DIFFERS without the USDC reader being at fault.
        continue-on-error: true
        run: pixi run bash hdCrust/test/usdc_roundtrip.sh "$RUNNER_TEMP/roundtrip"
      - name: Logs of a failed check
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/{compare,interact,roundtrip}/*/*.log "$RUNNER_TEMP"/{compare,interact,roundtrip}/*/diff.txt; do
            [ -f "$f" ] && { echo "== $f"; tail -20 "$f"; }
          done

  # What unwinding costs the render (design D8): instructions of a 2-spp
  # cornellbox render, one thread, under the CLI's `release` profile
  # (panic = "abort") and the delegate's `hydra` profile (panic = "unwind").
  # Callgrind counts are deterministic; the job prints both totals. Slow, so
  # nightly and by hand only.
  unwind-cost:
    name: Unwinding cost (callgrind)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain and valgrind
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}
          sudo apt-get update && sudo apt-get install -y valgrind
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build both profiles
        run: |
          cargo build --release -p crust-render
          cargo build --profile hydra -p crust-render
      - name: Instructions per profile
        run: |
          for profile in release hydra; do
            RAYON_NUM_THREADS=1 valgrind --tool=callgrind --cache-sim=no --branch-sim=no \
              --callgrind-out-file="callgrind.$profile" \
              "target/$profile/crust" render -i samples/cornellbox.usda -o "/tmp/$profile.exr" -s 2 -l error
            echo "$profile: $(callgrind_annotate "callgrind.$profile" | grep -m1 'PROGRAM TOTALS')"
          done

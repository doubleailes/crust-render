name: Rust

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: Build
        run: cargo build --workspace --verbose

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Restore cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      # `--no-fail-fast` keeps going past the first failing test binary so a
      # run reports every broken target at once, not just the first.
      - name: Run tests
        run: cargo test --workspace --no-fail-fast --verbose

  release:
    runs-on: ubuntu-latest
    name: release ${{ matrix.target }}
    if: github.event_name == 'release' && github.event.action == 'created'
    needs: [build, test]
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-gnu, x86_64-unknown-linux-musl, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@master
      - name: Compile and release
        uses: rust-build/rust-build.action@v1.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          RUSTTARGET: ${{ matrix.target }}
          EXTRA_FILES: "README.md LICENSE"
          TOOLCHAIN_VERSION: 1.85.1

name: Rust

# A change that touches only documentation (the OpenSpec records, docs/, the
# site/ user documentation, images, Markdown anywhere) cannot change what
# these jobs build or test, so it does not start them: no crate reads any of
# those paths (tests load samples/ and their own data/ fixtures only). A push
# or pull request that touches anything else alongside runs everything as
# usual. site/ has its own workflow, docs.yml. Keep the push and
# pull_request lists identical.

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "openspec/**"
      - "docs/**"
      - "site/**"
      - "images/**"
      - "logo/**"
      - ".claude/**"
      - "**/*.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths-ignore:
      - "openspec/**"
      - "docs/**"
      - "site/**"
      - "images/**"
      - "logo/**"
      - ".claude/**"
      - "**/*.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  release:
    types: [created]

# The checks only read the repository; the release job widens this for
# itself to upload assets.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Turn `cargo` warnings into errors as well, so a new deprecation or an
  # unused import fails the build instead of scrolling past in the log.
  RUSTFLAGS: -D warnings
  # One toolchain for every job, releases included. Clippy's lint set grows
  # with each stable, so an unpinned `stable` gate breaks every six weeks on
  # code nobody touched; and the release build has to compile the same
  # code the checks validated (let chains and `is_multiple_of` need 1.88+).
  # rust-toolchain.toml pins the same version for local builds; the fmt job
  # fails if the two disagree.
  RUST_VERSION: "1.98.1"

jobs:
  # Formatting is a pure text check: no dependencies, no build. It runs in
  # parallel with everything else and fails fast.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component rustfmt
          rustup default ${{ env.RUST_VERSION }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: rust-toolchain.toml matches RUST_VERSION
        run: grep -qx 'channel = "${{ env.RUST_VERSION }}"' rust-toolchain.toml

  # Advisories (RustSec), licences, duplicate versions and dependency
  # sources, against the committed Cargo.lock; policy in deny.toml. Needs no
  # toolchain beyond the action's own image.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --locked
          command: check

  # Clippy compiles the workspace (check mode, no codegen) and lints every
  # target, tests and examples included, with warnings promoted to errors.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy
          rustup default ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  # `cargo test` builds everything it needs, so there is no separate
  # `cargo build` step: it would compile the non-test artifacts only to have
  # the test profile rebuild them. `--no-fail-fast` keeps going past the
  # first failing test binary so one run reports every broken target.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests
        run: cargo test --workspace --no-fail-fast --verbose
      # The subdivision allocation ceilings are pinned by an `#[ignore]`d
      # probe that counts requested bytes through a global allocator, so it
      # has to run alone; the flags are the ones its documentation gives.
      - name: Subdivision memory probe
        run: cargo test -p crust-core --lib subdivision_memory_probe -- --ignored --nocapture --test-threads=1

  # Nightly Rust, the `bvh8` experiment included, runs in parallel as its
  # own workflow: .github/workflows/nightly.yml.

  release:
    runs-on: ubuntu-latest
    name: release ${{ matrix.target }}
    # Never onto the rolling `nightly` pre-release: nightly.yml builds and
    # publishes that one itself.
    if: github.event_name == 'release' && github.event.action == 'created' && github.event.release.tag_name != 'nightly'
    needs: [fmt, clippy, test, deny]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-gnu, x86_64-unknown-linux-musl, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile and release
        uses: rust-build/rust-build.action@6febf1b0ed6499a46610b58ef9d810398e75f3c2 # v1.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The root Cargo.toml is a virtual manifest, and the action lists
          # the binaries to build with `cargo read-manifest`, which refuses
          # one (and ignores EXTRA_COMMAND_FLAGS, so `-p` cannot help). Run
          # it from the binary crate instead; EXTRA_FILES still resolve
          # against the repository root.
          SRC_DIR: crates/crust-render
          RUSTTARGET: ${{ matrix.target }}
          EXTRA_FILES: "README.md LICENSE"
          TOOLCHAIN_VERSION: ${{ env.RUST_VERSION }}

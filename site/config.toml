# The user documentation of Crust Render, built with Zola and the AdiDoks
# theme (a git submodule in themes/adidoks — clone with --recursive, or run
# `git submodule update --init`). Preview with `zola serve` from this
# directory; .github/workflows/docs.yml builds and publishes it.

# The URL the site will be built for
base_url = "https://doubleailes.github.io/crust-render"
title = "Crust Render"
description = "Crust Render is a physically-based path tracer in safe Rust that renders USD scenes."

# The site theme to use.
theme = "adidoks"

# The default language; used in feeds and search index
default_language = "en"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to generate a feed file for the site
generate_feeds = false

# When set to "true", the generated HTML files are minified.
minify_html = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

[search]
# Whether to include the title of the page/section in the index
include_title = true
# Whether to include the description of the page/section in the index
include_description = false
# Whether to include the rendered content of the page/section in the index
include_content = true

[markdown]
# No syntax highlighting: most code blocks are shell or USD, and Zola has no
# USD grammar. (Highlighting moved to [markdown.highlighting] in Zola 0.22;
# leaving it off keeps this file valid for older and newer Zola alike.)

[extra]
author = "Philippe Llerena"
github = "https://github.com/doubleailes"

# Not hosted on netlify: GitHub Pages
is_netlify = false

# Set HTML file language
language_code = "en-US"

# Set theme-color meta tag for Chrome browser
theme_color = "#fff"

# More about site's title
title_separator = "|"
title_addition = "A path tracer for USD"

# Set date format in blog publish metadata
timeformat = "%B %e, %Y"
timezone = "Europe/Paris"

# Edit page on repository or not
edit_page = true
docs_repo = "https://github.com/doubleailes/crust-render"
repo_branch = "main"

## Math settings
math = false
library = "katex"

## Open Graph + Twitter Cards
[extra.open]
enable = true
# this image will be used as fallback if a page has no image of its own
image = "docs/getting-started/introduction/preview.png"
twitter_site = ""
twitter_creator = ""
facebook_author = ""
facebook_publisher = ""
og_locale = "en_US"

## JSON-LD
[extra.schema]
type = "Person"
logo = "docs/getting-started/introduction/preview.png"
twitter = ""
linked_in = ""
github = "https://github.com/doubleailes"
section = "docs"
## Sitelinks Search Box
site_links_search_box = false

# Menu items
[[extra.menu.main]]
name = "Docs"
section = "docs"
url = "/docs/getting-started/introduction/"
weight = 10


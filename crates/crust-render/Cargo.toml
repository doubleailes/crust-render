[package]
name = "crust-render"
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The package keeps the repository's name; the executable is `crust`.
[[bin]]
name = "crust"
path = "src/main.rs"

[features]
# Print per-ray BVH traversal counts in --stats. Diagnostic: the counters
# are global atomics, so counts are trustworthy and timings are not.
traversal-stats = ["crust-core/traversal-stats"]
# Nightly only: 8-wide BVH nodes (crust-rt's `bvh8`).
bvh8 = ["crust-core/bvh8"]
# MaterialX shading programs compiled to machine code (see crust-core's `jit`
# feature). `--no-default-features` builds the interpreter-only renderer.
default = ["jit", "mcp"]
jit = ["crust-core/jit"]
# `crust mcp`: a Model Context Protocol server over stdio for an agent's
# live session (the `mcp-session` capability). It brings in the MCP SDK and
# an async runtime, which carry only the protocol: the session itself runs
# on its own thread and the renders on rayon. `--no-default-features`
# builds the CLI without either.
mcp = [
    "dep:rmcp",
    "dep:tokio",
    "dep:openusd",
    "dep:serde",
    "dep:schemars",
    "dep:serde_json",
    "dep:base64",
]

[dependencies]
crust-core = { path = "../crust-core" }
# Everything that decodes a file lives in crust-assets; this binary only
# writes: `exr` for the linear EXR, `image` for the tone-mapped PNG.
crust-assets = { path = "../crust-assets" }
clap = { version = "4.5.48", features = ["derive"] }
image.workspace = true
indicatif = "0.18.0"
tracing.workspace = true
exr.workspace = true
# Ctrl-C: the first one cancels the render through its `RenderControl` and
# the partial outputs are written. Its `unsafe` is in installing the signal
# handler, never on the render path; this crate stays `forbid(unsafe_code)`.
ctrlc = "3.4"
# `mcp`: the official Rust MCP SDK, server side over stdin/stdout only (no
# HTTP transport, no auth), and the current-thread tokio runtime it runs on.
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io"], optional = true }
tokio = { version = "1.52", default-features = false, features = ["rt", "macros", "io-std", "sync", "time"], optional = true }
# `mcp`: the session authors its override layer through openusd, the same
# crate (and version) crust-core imports with.
# With `serde`, so a queried value reaches the client as the JSON of its
# `sdf::Value`.
openusd = { version = "0.7", default-features = false, features = ["serde"], optional = true }
# `mcp`: the tools' parameters and results. `schemars` is the version rmcp
# derives its input schemas with.
serde = { version = "1.0", features = ["derive"], optional = true }
schemars = { version = "1.2", optional = true }
serde_json = { version = "1.0.151", optional = true }
# `mcp`: a render's PNG goes to the client as base64 image content.
base64 = { version = "0.22", optional = true }

# The probe examples read a stage directly (`ptex_verify`, `proto_probe`,
# `rel_probe`, ...) and read `.ptx` headers and faces through the raw reader
# (`tex_probe`, `ptex_seams`) — the decoded `PtexColor` deliberately does not
# replace those, since they sample without the colour decode.
[dev-dependencies]
openusd = { version = "0.7", default-features = false }
openusd-schemas = { version = "0.7", default-features = false, features = ["geom"] }
ptex.workspace = true
# `std` for `tracing::subscriber::with_default`, which the product writer's
# test uses to see the warning an authored `crust:*` attribute gets.
tracing = { workspace = true, features = ["std"] }
# The CLI tests read the JSON reports back (crust-core serializes them);
# crust-core already depends on it, so it adds no package.
serde_json = "1.0.151"

[dependencies.tracing-subscriber]
version = "0.3.20"
features = ["fmt"]

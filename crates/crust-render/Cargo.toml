[package]
name = "crust-render"
version = { workspace = true }
edition.workspace = true
license-file.workspace = true

[features]
# Print per-ray BVH traversal counts in --stats. Diagnostic: the counters
# are global atomics, so counts are trustworthy and timings are not.
traversal-stats = ["crust-core/traversal-stats"]

[dependencies]
crust-core = {path = "../crust-core"}
clap = { version = "4.5.48", features = ["derive"] }
# Pure-Rust Ptex reader (crate/lib name `ptex`). Host-side only: crust-core
# decodes nothing, so the per-face texture decoder lives with the other
# format dependencies here.
ptex-rs = { git = "https://github.com/doubleailes/ptex-rs" }
image = { version = "0.25.6", default-features = false, features = ["png", "hdr"] }
indicatif = "0.18.0"
tracing.workspace = true
exr.workspace = true

# The probe examples read a stage directly: `ptex_verify` to check a .ptx file's
# embedded base cage against the geometry it is bound to, `proto_probe` /
# `rel_probe` to diagnose composition bugs against the prims the importer sees.
[dev-dependencies]
openusd = { version = "0.5", default-features = false, features = ["geom"] }

[dependencies.tracing-subscriber]
version = "0.3.20"
features = ["fmt"]
[package]
name = "crust-rt"
version = { workspace = true }
edition = { workspace = true }
license-file = { workspace = true }
description = "Crust Render's ray tracing kernel: Embree-shaped scene/geometry API over a parallel SBVH build collapsed to BVH4, in safe Rust"

[lib]
name = "crust_rt"
path = "src/lib.rs"

[features]
# Diagnostic traversal counters (nodes visited, leaf primitive tests).
# Off by default and compiled out entirely, because they sit in the
# innermost loop: with the feature on the counters are global atomics, so
# trust the *counts* from a feature-on build and the *timings* from a
# feature-off one, never both from the same run.
traversal-stats = []
# 8-wide BVH nodes on `std::simd::f32x8` instead of 4-wide on glam's `Vec4`.
# **Nightly only** (`portable_simd` is unstable): a stable toolchain rejects it
# with E0554. An experiment, not a default — build with
# `cargo +nightly ... --features bvh8`, ideally under
# `RUSTFLAGS='-C target-cpu=x86-64-v3'` so an f32x8 is one AVX register rather
# than two SSE halves. See docs/simd.md, "BVH8 on nightly".
bvh8 = []

[dependencies]
glam.workspace = true
rayon = "1.10.0"

[dev-dependencies]
criterion = "0.8"
# Seeded randomness for the tests; the library itself stays on glam + rayon.
openqmc-rs = "0.2.4"

[[bench]]
name = "traversal"
harness = false

[[example]]
name = "traversal_probe"
# Needs the counters it reads, so it is not built for a default `cargo test`.
required-features = ["traversal-stats"]

[package]
name = "crust-core"
version = { workspace = true }
edition = { workspace = true }
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "crust_core"
path = "src/lib.rs"

[features]
# Forwards crust-rt's traversal counters; see that crate's feature.
traversal-stats = ["crust-rt/traversal-stats"]
# Forwards crust-rt's nightly-only 8-wide BVH nodes; see that crate's feature.
bvh8 = ["crust-rt/bvh8"]
# Compile MaterialX programs to machine code with Cranelift (crust-jit, the
# workspace's one crate with `unsafe` outside tests). Off here and on in
# the renderer, so the engine library carries no JIT unless a host asks;
# `CRUST_SHADER_JIT=0` turns it off at run time.
jit = ["dep:crust-jit"]
# Read the import's USD files through read-only memory mappings:
# `usd_import::stage_builder` opts in through the crate's one non-test
# `unsafe`, which this feature alone compiles. Off here and on in the
# renderer, like `jit`; `CRUST_USD_MMAP=0` turns it off at run time.
# (openusd's own `mmap`, and with it `memmap2`, is compiled in either way for
# now: openusd-schemas names openusd with its default features, which include
# it. Without this feature nothing calls it.)
mmap = ["openusd/mmap"]

[dependencies]
utils = { path = "../utils" }
openqmc-rs = "0.2.4"
crust-rt = { path = "../crust-rt" }
rayon = "1.10.0"
glam.workspace = true
tracing.workspace = true
openusd = { version = "0.7", default-features = false }
# The typed schema views (UsdGeom / UsdLux / UsdShade / UsdRender) left the
# core crate in openusd 0.7 and ship separately, versioned in lockstep.
openusd-schemas = { version = "0.7", default-features = false, features = ["geom", "lux", "shade", "render"] }
# Pure-Rust OpenSubdiv port (Far topology refinement + Sdc rules) driving
# Catmull-Clark subdivision at USD import: zero dependencies,
# `forbid(unsafe_code)`. Pinned to a release tag; the committed `Cargo.lock`
# records the commit it resolved to (c672796), so a moved tag changes nothing
# until a `cargo update`, and then shows as a lock diff in review.
opensubdiv-rs = { git = "https://github.com/doubleailes/OpenSubdiv-rs", tag = "0.5.0" }
# The standalone MaterialX reader; `material/materialx.rs` adapts its compiled
# graphs onto `Material` / `OpenPBR`.
crust-mtlx = { path = "../crust-mtlx" }
ocio.workspace = true
crust-jit = { path = "../crust-jit", optional = true }
# The `crust diagnostic` report (`diagnostic/report.rs`): written as JSON
# for a machine reader, and read back for `--baseline`. Both were already in
# the lock (criterion's, a dev-dependency), so naming them adds no package;
# they are new to the renderer's own build. Neither carries `unsafe` on any
# hot path: they run once per diagnostic, after the renders.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
criterion = "0.8"
# `std` for `tracing::subscriber::with_default`, which the import tests use
# to check which warnings a stage's render settings produce.
tracing = { workspace = true, features = ["std"] }

[[bench]]
name = "integrator"
harness = false

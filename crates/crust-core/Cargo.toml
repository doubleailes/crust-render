[package]
name = "crust-core"
version = { workspace = true }
edition = { workspace = true }
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The engine as one library: re-exports crust-base, crust-shading, crust-world, crust-integrator, crust-usd and crust-tools."

[lib]
name = "crust_core"
path = "src/lib.rs"

[features]
# Forward the layer crates' features; each is described where it is defined.
traversal-stats = ["crust-world/traversal-stats"]
bvh8 = ["crust-base/bvh8"]
jit = ["crust-shading/jit"]
mmap = ["crust-usd/mmap"]

[dependencies]
crust-base = { path = "../crust-base" }
crust-shading = { path = "../crust-shading" }
crust-world = { path = "../crust-world" }
crust-integrator = { path = "../crust-integrator" }
crust-usd = { path = "../crust-usd" }
crust-tools = { path = "../crust-tools" }

[dev-dependencies]
criterion = "0.8"
# `std` for `tracing::subscriber::with_default`, which the import tests use
# to check which warnings a stage's render settings produce.
tracing = { workspace = true, features = ["std"] }
# What the integration tests and the bench name directly, besides the
# engine: they reached these through crust-core's own dependencies before
# the engine split into crates.
glam.workspace = true
openqmc-rs = "0.2.4"
openusd.workspace = true
openusd-schemas = { workspace = true, features = ["geom", "lux", "shade", "render", "skel", "vol", "proc", "media"] }
rayon.workspace = true
serde_json = "1.0.151"
utils = { path = "../utils" }

[[bench]]
name = "integrator"
harness = false

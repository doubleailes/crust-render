[package]
name = "crust-core"
version = { workspace = true }
edition = { workspace = true }
license-file = { workspace = true }

[lib]
name = "crust_core"
path = "src/lib.rs"

[features]
# Forwards crust-rt's traversal counters; see that crate's feature.
traversal-stats = ["crust-rt/traversal-stats"]

[dependencies]
utils = { path = "../utils" }
openqmc-rs = "0.1"
crust-rt = { path = "../crust-rt" }
rayon = "1.10.0"
glam.workspace = true
tracing.workspace = true
openusd = { version = "0.6", default-features = false, features = ["geom", "lux", "shade", "render"] }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "integrator"
harness = false

[package]
name = "crust-core"
version = { workspace = true }
edition = { workspace = true }
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "crust_core"
path = "src/lib.rs"

[features]
# Forwards crust-rt's traversal counters; see that crate's feature.
traversal-stats = ["crust-world/traversal-stats"]
# Forwards crust-rt's nightly-only 8-wide BVH nodes; see that crate's feature.
bvh8 = ["crust-rt/bvh8"]
# MaterialX programs compiled with Cranelift; see crust-shading's feature.
# Off here and on in the renderer.
jit = ["crust-shading/jit"]
# Memory-mapped USD reads; see crust-usd's feature. Off here and on in the
# renderer.
mmap = ["crust-usd/mmap"]

# The engine is split into layered crates (`docs/architecture.md` § Crates),
# each depending only on those below it; this one re-exports their public
# surface unchanged, so a host names `crust_core::…` and nothing else.
[dependencies]
crust-base = { path = "../crust-base" }
crust-shading = { path = "../crust-shading" }
crust-world = { path = "../crust-world" }
crust-tracer = { path = "../crust-tracer" }
crust-usd = { path = "../crust-usd" }
crust-tools = { path = "../crust-tools" }
crust-rt = { path = "../crust-rt" }

[dev-dependencies]
criterion = "0.8"
utils = { path = "../utils" }
openqmc-rs = "0.2.4"
rayon.workspace = true
glam.workspace = true
openusd.workspace = true
openusd-schemas = { workspace = true, features = ["geom", "lux", "shade", "render", "skel", "vol", "proc", "media"] }
serde_json = "1.0.151"
# `std` for `tracing::subscriber::with_default`, which the import tests use
# to check which warnings a stage's render settings produce.
tracing = { workspace = true, features = ["std"] }

[[bench]]
name = "integrator"
harness = false

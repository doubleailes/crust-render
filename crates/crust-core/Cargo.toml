[package]
name = "crust-core"
version = { workspace = true }
edition = { workspace = true }
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "crust_core"
path = "src/lib.rs"

[features]
# Forwards crust-rt's traversal counters; see that crate's feature.
traversal-stats = ["crust-rt/traversal-stats"]
# Forwards crust-rt's nightly-only 8-wide BVH nodes; see that crate's feature.
bvh8 = ["crust-rt/bvh8"]
# Compile MaterialX programs to machine code with Cranelift (crust-jit, the
# workspace's one crate with `unsafe` outside tests). Off here and on in
# the renderer, so the engine library carries no JIT unless a host asks;
# `CRUST_SHADER_JIT=0` turns it off at run time.
jit = ["dep:crust-jit"]

[dependencies]
utils = { path = "../utils" }
openqmc-rs = "0.2.4"
crust-rt = { path = "../crust-rt" }
rayon = "1.10.0"
glam.workspace = true
tracing.workspace = true
openusd = { version = "0.7", default-features = false }
# The typed schema views (UsdGeom / UsdLux / UsdShade / UsdRender) left the
# core crate in openusd 0.7 and ship separately, versioned in lockstep.
openusd-schemas = { version = "0.7", default-features = false, features = ["geom", "lux", "shade", "render"] }
# Pure-Rust OpenSubdiv port (Far topology refinement + Sdc rules) driving
# Catmull-Clark subdivision at USD import: zero dependencies,
# `forbid(unsafe_code)`. Pinned by `rev`, the commit release tag `0.5.0`
# points at, rather than by the tag itself: a tag can be moved, a commit
# cannot. Bumping it means naming the new release's commit here.
opensubdiv-rs = { git = "https://github.com/doubleailes/OpenSubdiv-rs", rev = "c672796f9587c369b26ea7df03cff0a8534eecd2" }
# The standalone MaterialX reader; `material/materialx.rs` adapts its compiled
# graphs onto `Material` / `OpenPBR`.
crust-mtlx = { path = "../crust-mtlx" }
crust-jit = { path = "../crust-jit", optional = true }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "integrator"
harness = false

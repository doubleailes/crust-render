[package]
name = "crust-world"
version = { workspace = true }
edition = { workspace = true }
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The scene the integrator traces: the World over the intersection kernel with its per-geometry side tables, and the lights, their shapes and their selection."

[lib]
name = "crust_world"
path = "src/lib.rs"

[features]
# Forwards crust-rt's traversal counters; see that crate's feature.
traversal-stats = ["crust-rt/traversal-stats"]

[dependencies]
crust-base = { path = "../crust-base" }
crust-shading = { path = "../crust-shading" }
utils = { path = "../utils" }
openqmc-rs = "0.2.4"
crust-rt = { path = "../crust-rt" }
glam.workspace = true
tracing.workspace = true
# The tiny-network kit `neural` light selection reads its frozen network
# with (`light/neural.rs`): no dependencies, `forbid(unsafe_code)`.
crust-nn = { path = "../crust-nn" }

[dev-dependencies]
# `std` for `tracing::subscriber::with_default`, which tests use to check
# which warnings a call raises.
tracing = { workspace = true, features = ["std"] }

[package]
name = "crust-usd"
version = { workspace = true }
edition = { workspace = true }
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "USD import: the streaming stage traversal and schema mapping, subdivision, displacement, instancing, render settings and products, and in-place updates of an imported scene."

[lib]
name = "crust_usd"
path = "src/lib.rs"

[features]
# Read the import's USD files through read-only memory mappings:
# `usd_import::stage_builder` opts in through the workspace's one non-test
# `unsafe` outside crust-jit, which this feature alone compiles. Off here and
# on in the renderer, like `jit`; `CRUST_USD_MMAP=0` turns it off at run time.
# openusd's own `mmap`, and with it `memmap2`, is compiled in only with this
# feature: openusd has no default features since 0.8.
mmap = ["openusd/mmap"]

[dependencies]
crust-base = { path = "../crust-base" }
crust-shading = { path = "../crust-shading" }
crust-world = { path = "../crust-world" }
crust-integrator = { path = "../crust-integrator" }
utils = { path = "../utils" }
crust-rt = { path = "../crust-rt" }
crust-mtlx = { path = "../crust-mtlx" }
rayon.workspace = true
glam.workspace = true
tracing.workspace = true
openusd.workspace = true
# The typed schema views (UsdGeom / UsdLux / UsdShade / UsdRender) left the
# core crate in openusd 0.7 and ship separately, versioned in lockstep. UsdSkel,
# UsdVol, UsdProc and UsdMedia are compiled in for their types alone: the import
# composes a prim's xformOps only when the schema registry knows it is
# Xformable, and a SkelRoot, Volume, GenerativeProcedural or SpatialAudio from a
# family left out is unknown, so its transform would be dropped. With them,
# every Xformable type C++ USD defines is known (the remaining families,
# UsdPhysics, UsdUI and UsdSemantics, define none).
openusd-schemas = { workspace = true, features = ["geom", "lux", "shade", "render", "skel", "vol", "proc", "media"] }
# Pure-Rust OpenSubdiv port (Far topology refinement + Sdc rules) driving
# Catmull-Clark subdivision at USD import: zero dependencies,
# `forbid(unsafe_code)`. Pinned to a release tag; the committed `Cargo.lock`
# records the commit it resolved to (c672796), so a moved tag changes nothing
# until a `cargo update`, and then shows as a lock diff in review.
opensubdiv-rs = { git = "https://github.com/doubleailes/OpenSubdiv-rs", tag = "0.5.0" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
# `std` for `tracing::subscriber::with_default`, which tests use to check
# which warnings a call raises.
tracing = { workspace = true, features = ["std"] }

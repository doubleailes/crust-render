[package]
name = "crust-assets"
version = { workspace = true }
edition = { workspace = true }
license-file = { workspace = true }
description = "Host-side asset decoders for Crust Render: crust_core::AssetLoader over exr, image and ptex-rs (environment maps, Ptex, UV/UDIM textures)"

[lib]
name = "crust_assets"
path = "src/lib.rs"

[dependencies]
crust-core = { path = "../crust-core" }
exr.workspace = true
image.workspace = true
ptex.workspace = true
tiff.workspace = true
flate2.workspace = true
half.workspace = true
tracing.workspace = true

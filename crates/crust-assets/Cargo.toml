[package]
name = "crust-assets"
version = { workspace = true }
edition = { workspace = true }
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Host-side asset decoders for Crust Render: crust_core::AssetLoader over exr, image and ptex-rs (environment maps, Ptex, UV/UDIM textures)"

[lib]
name = "crust_assets"
path = "src/lib.rs"

[dependencies]
# Everything a decoder hands the engine (`AssetLoader`, the texture traits,
# `EnvironmentMap`, colour spaces, `Config`) is in `crust-world` or below it,
# so the decoders build beside the integrator and the import, not after them.
crust-world = { path = "../crust-world" }
exr.workspace = true
image.workspace = true
ptex.workspace = true
tiff.workspace = true
flate2.workspace = true
half.workspace = true
# The render pool's size, read once, to size the per-thread texture caches'
# share of the budget (`ptex_stream::micro_threads`).
rayon.workspace = true
tracing.workspace = true

[dev-dependencies]
# The tests import stages through the decoders.
crust-core = { path = "../crust-core" }
# `std` for `tracing::subscriber::with_default`, which the WARN-once test
# counts events through.
tracing = { workspace = true, features = ["std"] }

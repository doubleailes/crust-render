[package]
name = "crust-assets"
version = { workspace = true }
edition = { workspace = true }
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Host-side asset decoders for Crust Render: crust_core::AssetLoader over exr, image and ptex-rs (environment maps, Ptex, UV/UDIM textures)"

[lib]
name = "crust_assets"
path = "src/lib.rs"

[dependencies]
crust-core = { path = "../crust-core" }
exr.workspace = true
image.workspace = true
ptex.workspace = true
tiff.workspace = true
flate2.workspace = true
half.workspace = true
# The render pool's size, read once, to size the per-thread texture caches'
# share of the budget (`ptex_stream::micro_threads`).
rayon = "1.10.0"
tracing.workspace = true

[dev-dependencies]
# `std` for `tracing::subscriber::with_default`, which the WARN-once test
# counts events through.
tracing = { workspace = true, features = ["std"] }

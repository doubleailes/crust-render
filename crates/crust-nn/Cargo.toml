[package]
name = "crust-nn"
version = { workspace = true }
edition = { workspace = true }
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Crust Render's tiny-network kit: hash-grid encoding, dense layers, sigmoid cross-entropy and Adam, bit-deterministic, in safe Rust with no dependencies"

[lib]
name = "crust_nn"
path = "src/lib.rs"

# None, on purpose: the kit is `std` alone, so it carries no `unsafe` and no
# version to keep in step. The caller brings the parallelism (see
# `Network::batch_gradient`) and the random numbers (`Network::new`).
[dependencies]

[dev-dependencies]
# Only to show that a batch's gradient is the same at any thread count.
rayon.workspace = true
# Seeded randomness for the tests: the repository rule is that tests which
# only need random draws use `openqmc::pcg::Rng`.
openqmc-rs = "0.2.4"

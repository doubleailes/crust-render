[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
# The oldest toolchain that builds the workspace, checked with
# `cargo +1.96 check --workspace --all-targets --locked`. Set by cranelift
# (rust-version 1.96 as locked), which the renderer's default `jit` feature
# pulls; crust's own code needs only 1.88 (let chains, `is_multiple_of`).
# CI builds with the newer pin in rust-toolchain.toml.
rust-version = "1.96"
# SPDX form of LICENSE, so cargo-deny can check our own crates too.
license = "MIT"
version = "0.4.0"
# Nothing here goes to crates.io: crust-core and crust-assets depend on git
# repositories, which crates.io refuses. Releases are the GitHub binaries.
publish = false

[workspace.dependencies]
glam = "0.33.2"
tracing = {version = "0.1.41", default-features = false}
exr = "1.74.2"
# Decoder-side image formats. Declared once so `crust-assets` (which decodes)
# and `crust-render` (which writes PNGs) resolve the same package; the
# `hdr`/`jpeg` features are the decoder's and reach crust-render through
# feature unification whether stated here or not. `tiff` decodes plain
# (untiled) `.tif` sources — Substance-style UDIM exports — and needs
# image >= 0.25.10 (which depends on tiff 0.11), so it unifies with the
# `.tx` reader's `tiff` below instead of adding a second copy.
image = { version = "0.25.10", default-features = false, features = ["png", "hdr", "jpeg", "tiff"] }
# Pure-Rust Ptex reader (package `ptex-rust`, lib name `ptex`), from
# crates.io. 0.3.1 is the floor because it is the first release on lru 0.18.2,
# clear of RUSTSEC-2026-0002 and RUSTSEC-2026-0253; the committed Cargo.lock
# pins the exact version. Hoisted so the decoder crate and the probe examples
# that read `.ptx` directly can never disagree on the version.
#
# The `cache` feature is the one this bump was for: it brings `SharedReader`,
# a `&self` reader over a byte-budgeted cache of decoded pixels, which is the
# `PtexCache` equivalent "Known incomplete work" said streaming Ptex was
# waiting on. It is the crate's default feature and is named here anyway, so
# the dependency states what crust actually needs rather than inheriting it.
#
# The upstream package was renamed `ptex-rs` -> `ptex-rust` in the same range,
# so the dependency needs `package = `. The key is then what names the extern
# crate — a renamed dependency is addressed by its key, not by its lib target
# — so the key is `ptex`, which is both the lib name and what every `use` in
# the workspace already says.
ptex = { package = "ptex-rust", version = "0.3.1", features = ["cache"] }
# Tiled, mip-mapped TIFF — the `.tx` textures a streaming cache reads a single
# tile at a time. Named directly rather than reached through `image`, because
# the tiled reader uses the chunk API (`read_chunk`, `seek_to_image`) that
# `image` does not expose. It is the same package `image`'s `tiff` feature
# pulls (both 0.11), so the graph holds one copy. `default-features = false`
# here states what the `.tx` path needs; `image` enables tiff's default
# features (lzw/jpeg/fax) through unification, which plain `.tif` exports
# routinely need — LZW is the usual compression out of Substance and Photoshop.
tiff = { version = "0.11.3", default-features = false, features = ["deflate"] }
# Already in the graph transitively (png, ptex-rs, zip); named here because the
# `.tx` writer deflates each tile itself. The `tiff` crate only applies its own
# compression inside the bulk strip writer, which is not a path a tiled file
# can take — so the zlib stream is ours to produce.
flate2 = "1.1"
# `half` is EXR's native sample type, and a streamed HDR tile is stored in it
# rather than widened to `f32`: the cache's budget is a byte count, so the
# payload's size *is* the residency policy. Already in the lock via `exr`
# (and `ptex-rs`), so naming it here adds no package.
half = "2.7"
# Every transfer curve and colour-space name, from a pure-Rust port of
# OpenColorIO (no `unsafe` in the crate). crust works in `lin_rec709`; the
# builtin ACES CG config resolves MaterialX / USD colour-space names through
# its aliases and supplies the curves. Not on crates.io and untagged
# (doubleailes/ocio-rs#2), so pinned by commit:
# the committed `Cargo.lock` records it, and a bump is a lock diff in review.
ocio = { git = "https://github.com/doubleailes/ocio-rs", rev = "c083676e0eae9c5a31e0da2346dae01d050dda7a" }

# The hot loops are spread across crates: the integrator in `crust-core`
# calls the kernel in `crust-rt`, which calls `glam`'s SIMD vector ops.
# Every one of those is a small `#[inline]` function whose whole point is
# to disappear into its caller — with the default 16 codegen units and no
# LTO, cross-crate calls survive as real calls and the vectorized bodies
# never fuse. LTO + a single codegen unit is what lets the SIMD already in
# the code actually reach the machine code.
#
# `fat` rather than `thin`: measured at 3.989G instructions against thin's
# 4.050G on `cornellbox -s 2` (-1.5%), for link time only, and the image
# stays bit-identical across all sample scenes — Rust does not enable
# fast-math and LLVM will not reassociate float arithmetic without it, so
# whole-program inlining moves no bits. Wall clock cannot resolve this on a
# loaded machine (the run-to-run spread reaches 15%), which is why the
# number above is an instruction count; see scripts/bench_scenes.sh.
[profile.release]
lto = "fat"
codegen-units = 1
# No `catch_unwind` and no `should_panic` anywhere in the workspace, and
# crust-core's "return `Error`, never exit" contract is about *recoverable*
# errors — those are `Result` values, not panics — so nothing depends on
# unwinding. Dropping it removes the landing pads around the `expect()`s and
# the indexing in the bounce loop. Cargo forces `unwind` for the `test` and
# `bench` profiles regardless, so `cargo test` is unaffected.
panic = "abort"
# Deliberately no `debug` setting. Callgrind and perf already name functions
# from the symbol table, which is how every measurement behind these settings
# was taken; `debug = "line-tables-only"` adds only *line*-level attribution
# and quadruples the binary (5 MiB -> 20 MiB). Ask for it per-invocation when
# you actually want to annotate inside a function:
#     CARGO_PROFILE_RELEASE_DEBUG=line-tables-only cargo build --release
# (Not `RUSTFLAGS='-C debuginfo=...'`: since Rust 1.77 a release profile with
# no `debug` setting also defaults to `strip = "debuginfo"`, which removes
# whatever the flag produced, and callgrind silently falls back to `???`.)

# Benchmarks inherit their own profile, not `release`, so mirror the codegen
# or they measure a different program than the one that ships. (`panic` is
# ignored here by Cargo — the harness needs to unwind.)
[profile.bench]
lto = "fat"
codegen-units = 1

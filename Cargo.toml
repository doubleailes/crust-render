[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license-file = "LICENSE"
version = "0.2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
glam = { version = "0.33.2", features = ["serde"] }
tracing = {version = "0.1.41", default-features = false}
exr = "1.74.2"
rand = "0.9.2"
# Decoder-side image formats. Declared once so `crust-assets` (which decodes)
# and `crust-render` (which writes PNGs) resolve the same package; the
# `hdr`/`jpeg` features are the decoder's and reach crust-render through
# feature unification whether stated here or not.
image = { version = "0.25.6", default-features = false, features = ["png", "hdr", "jpeg"] }
# Pure-Rust Ptex reader (lib name `ptex`). Pinned by `rev` because the crate is
# not published and `Cargo.lock` is not checked in — without it a fresh clone
# silently takes whatever `main` points at. Hoisted so the decoder crate and
# the probe examples that read `.ptx` directly can never disagree on the pin:
# two crates naming a git dependency must match URL and rev byte for byte, or
# Cargo sees two packages with the same lib name.
ptex-rs = { git = "https://github.com/doubleailes/ptex-rs", rev = "36212f65dbd4caf7fb8786b34da5c041cc59d7f1" }

# The hot loops are spread across crates: the integrator in `crust-core`
# calls the kernel in `crust-rt`, which calls `glam`'s SIMD vector ops.
# Every one of those is a small `#[inline]` function whose whole point is
# to disappear into its caller — with the default 16 codegen units and no
# LTO, cross-crate calls survive as real calls and the vectorized bodies
# never fuse. LTO + a single codegen unit is what lets the SIMD already in
# the code actually reach the machine code.
#
# `fat` rather than `thin`: measured at 3.989G instructions against thin's
# 4.050G on `cornellbox -s 2` (-1.5%), for link time only, and the image
# stays bit-identical across all sample scenes — Rust does not enable
# fast-math and LLVM will not reassociate float arithmetic without it, so
# whole-program inlining moves no bits. Wall clock cannot resolve this on a
# loaded machine (the run-to-run spread reaches 15%), which is why the
# number above is an instruction count; see scripts/bench_scenes.sh.
[profile.release]
lto = "fat"
codegen-units = 1
# No `catch_unwind` and no `should_panic` anywhere in the workspace, and
# crust-core's "return `Error`, never exit" contract is about *recoverable*
# errors — those are `Result` values, not panics — so nothing depends on
# unwinding. Dropping it removes the landing pads around the `expect()`s and
# the indexing in the bounce loop. Cargo forces `unwind` for the `test` and
# `bench` profiles regardless, so `cargo test` is unaffected.
panic = "abort"
# Deliberately no `debug` setting. Callgrind and perf already name functions
# from the symbol table, which is how every measurement behind these settings
# was taken; `debug = "line-tables-only"` adds only *line*-level attribution
# and quadruples the binary (5 MiB -> 20 MiB). Ask for it per-invocation when
# you actually want to annotate inside a function:
#     RUSTFLAGS='-C debuginfo=line-tables-only' cargo build --release

# Benchmarks inherit their own profile, not `release`, so mirror the codegen
# or they measure a different program than the one that ships. (`panic` is
# ignored here by Cargo — the harness needs to unwind.)
[profile.bench]
lto = "fat"
codegen-units = 1
